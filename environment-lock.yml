# Exact versions the validation results shipped with this repository were
# produced with. Use `environment.yml` for day-to-day work and this file to
# reproduce the numbers in `notebooks/validation.ipynb` bit for bit.
name: spey-roofit-lock
channels:
  - conda-forge
dependencies:
  - python=3.13.9
  - root=6.36.04
  - numpy=2.3.5
  - scipy=1.16.3
  - pip
  - pip:
      - spey==0.2.6
      - pyhf==0.7.6
      - iminuit==2.32.0
      - pytest==7.4.4
      - matplotlib==3.10.8
      - jupyter
