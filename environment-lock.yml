# Exact versions the validation results shipped with this repository were
# produced with. Use `environment.yml` for day-to-day work and this file to
# reproduce the numbers in the two `validation.ipynb` notebooks bit for bit.
name: spey-roofit-lock
channels:
  - conda-forge
dependencies:
  - python=3.13.9
  - root=6.36.04
  - numpy=2.3.5
  - scipy=1.16.3
  - pip
  - pip:
      # spey 0.2.8-b1 is the first version whose Asimov datasets carry the
      # profiled auxiliary measurements; the validation compares against it.
      # Neither it nor the required spey-hs3 is on PyPI yet.
      - spey @ git+https://github.com/SpeysideHEP/spey@multipoi-multihisto
      - spey-hs3==0.03
      - spey-pyhf==0.2.2
      - pyhf==0.7.6
      - iminuit==2.32.0
      - pytest==7.4.4
      - matplotlib==3.10.8
      - jupyter
