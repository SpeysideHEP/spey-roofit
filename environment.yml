# Reproducible development environment for spey-roofit.
#
#   conda env create -f environment.yml
#   conda activate spey-roofit
#   pip install -e .
#
# ROOT and CMS Combine are only available from conda-forge, which is why the
# plug-in ships a conda environment rather than relying on pip alone.
name: spey-roofit
channels:
  - conda-forge
dependencies:
  - python >=3.10,<3.15
  - root >=6.30
  # the CMS Combine backend drives combine itself rather than reimplementing it
  - cms-combine >=10.5
  - numpy >=1.24
  - scipy >=1.10
  - pip
  - pip:
      # spey 0.2.8 is the first version whose Asimov datasets carry the
      # profiled auxiliary measurements, and spey-hs3 needs a WorkspaceInterpreter
      # newer than its last release. Neither is on PyPI yet, hence the git
      # sources; switch to `spey>=0.2.8` and `spey-hs3>=0.0.3` once they are.
      - spey @ git+https://github.com/SpeysideHEP/spey@multipoi-multihisto
      - spey-hs3>=0.0.3
      # validation and testing; the pyhf comparisons go through the plug-in
      - spey-pyhf>=0.2.0
      - pytest>=7.1.2
      - pytest-cov>=3.0.0
      # notebooks
      - jupyter
      - matplotlib>=3.7
